name: Release z3-src (prepare)

# Opens a z3-src release PR. Once it merges, run update-z3-sys.yml for the
# matching z3-sys update.

on:
  workflow_dispatch:
    inputs:
      z3_tag:
        description: "Z3 git tag to release (e.g. z3-4.16.0)"
        required: true
        type: string

jobs:
  prepare-z3-src:
    name: Prepare z3-src release PR
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'prove-rs' }}
    permissions:
      contents: write
      pull-requests: write
    env:
      Z3_TAG: ${{ inputs.z3_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Prepare z3-src
        id: prep
        run: |
          cargo xtask prepare-z3-src "$Z3_TAG"
          git add z3-src/Cargo.toml z3-src/z3
          echo "version=$(cargo xtask z3-version)" >> "$GITHUB_OUTPUT"

      - name: Commit and open PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          VERSION: ${{ steps.prep.outputs.version }}
        run: |
          branch="release/z3-src-$VERSION"
          title="chore(z3-src): release for Z3 $VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -m "$title"
          git push origin "$branch"
          gh pr create \
            --title "$title" \
            --body "Automated release PR. Review the submodule pointer and Cargo.toml version, then merge to publish. After merging, run the \"Update z3-sys for z3-src\" workflow for the follow-up z3-sys update." \
            --base master \
            --head "$branch"
